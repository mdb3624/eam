spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: eam
    user: ${FLYWAY_DB_USERNAME}
    password: ${FLYWAY_DB_PASSWORD}
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    placeholders:
      runtime_password: ${DB_PASSWORD}
      login_lookup_password: ${DB_LOGIN_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8180}

management:
  endpoints:
    web:
      exposure:
        include: health
